[platformio]
default_envs = cyd

[env]
platform = espressif32
board = esp32dev
framework = arduino
lib_deps = 
    bodmer/TFT_eSPI@^2.5.43
    nitek/XPT2046_Bitbang_Slim@^2.0.0
    sh123/esp32_opus
; UART0: USB debug console. EARS uses UART2 at 921600 baud.
monitor_speed = 115200
upload_speed = 921600

monitor_filters = esp32_exception_decoder
board_build.partitions = min_spiffs.csv
build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DPIUU_DIAGNOSTICS=1
    ; Set to 0 to remove performance measurements and their logs.
    -DPIUU_PERFORMANCE_DIAGNOSTICS=0
    ; UDP arrival gaps, playback skips and connection/send diagnostics.
    -DPIUU_NETWORK_DIAGNOSTICS=1
    ; Set to 0 to remove detailed UART error/sequence diagnostics.
    -DPIUU_UART_DIAGNOSTICS=1
    -DUSER_SETUP_LOADED
    -DTFT_INVERSION_ON
    -DUSE_HSPI_PORT
    -DTFT_MISO=12
    -DTFT_MOSI=13
    -DTFT_SCLK=14
    -DTFT_CS=15
    -DTFT_DC=2
    -DTFT_RST=-1
    -DTFT_BL=21
    -DTFT_BACKLIGHT_ON=HIGH
    -DSPI_FREQUENCY=40000000
    -DSPI_READ_FREQUENCY=20000000
    -DSPI_TOUCH_FREQUENCY=2500000
    -DLOAD_GLCD
    -DLOAD_FONT2
    -DLOAD_FONT4
    -DLOAD_FONT6
    -DLOAD_FONT7
    -DLOAD_FONT8
    -DLOAD_GFXFF

[env:cyd]
build_flags =
    ${env.build_flags}
    -DILI9341_2_DRIVER

[env:cyd2usb]
build_flags =
    ${env.build_flags}
    -DST7789_DRIVER
    -DTFT_RGB_ORDER=TFT_BGR
    -DTFT_INVERSION_OFF

; New EARS wiring: CORE RX0=GPIO3, TX0=GPIO1. Application logs are muted.
[env:cyd-uart0]
extends = env:cyd
build_flags =
    ${env:cyd.build_flags}
    -DPIUU_EARS_UART0=1
    -DPIUU_EARS_RX_PIN=3
    -DPIUU_EARS_TX_PIN=1

[env:cyd2usb-uart0]
extends = env:cyd2usb
build_flags =
    ${env:cyd2usb.build_flags}
    -DPIUU_EARS_UART0=1
    -DPIUU_EARS_RX_PIN=3
    -DPIUU_EARS_TX_PIN=1
